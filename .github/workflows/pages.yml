name: Lab on GitHub Pages

on:
  # Called by Version for every release
  workflow_call:
    inputs:
      version:
        description: Release tag
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy the lab
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - uses: extractions/setup-just@v3

      - name: Build the lab for the web
        env:
          VERSION: ${{ inputs.version }}
        run: just build-web "$VERSION"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
