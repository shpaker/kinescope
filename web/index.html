<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kinescope lab</title>
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <header>
    <h1>kinescope lab</h1>
    <span class="version" id="version"></span>
    <button class="ghost" id="go-get" title="Copy the go get line">go get</button>
    <a class="ghost" href="https://github.com/shpaker/kinescope" target="_blank" rel="noopener">GitHub</a>
    <a class="ghost" href="llms.txt" target="_blank" title="How an agent writes a link to a setup">for agents</a>
    <span class="spacer"></span>
    <label>Preset <select id="preset"></select></label>
    <label>Seed <input type="number" id="seed" min="0" step="1"></label>
    <button class="ghost" id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button class="ghost" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
    <button id="copy-link">Copy link</button>
  </header>
  <main>
    <section id="setup">
      <div class="section-hint">Starting the lab…</div>
    </section>
    <section id="middle">
      <iframe id="frame" src="screen.html" title="The picture through the TV"></iframe>
      <div class="strip" id="picture">
        <label>Picture <select id="source">
          <option value="test-card">Test card</option>
          <option value="scene">Moving scene</option>
          <option value="dropped">Dropped picture</option>
        </select></label>
        <label>Scale <select id="scale">
          <option value="0">fit</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>8</option>
        </select></label>
        <label><input type="checkbox" id="bypass"> Bypass the TV</label>
        <span class="empty" id="drop-hint">Drop a picture onto the screen to see it through the TV.</span>
      </div>
      <div class="strip" id="game"></div>
    </section>
    <section id="code">
      <div class="tabs">
        <button id="tab-go" class="on">Go</button>
        <button id="tab-kage">Kage</button>
        <span class="spacer"></span>
        <button class="ghost" id="mode" title="Setup alone, or a whole Ebitengine game">Full example</button>
        <button id="copy-code">Copy</button>
      </div>
      <pre id="listing"></pre>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="lab.js"></script>
</body>
</html>
